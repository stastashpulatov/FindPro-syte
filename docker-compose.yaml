version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: findpro_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findpro}
      POSTGRES_USER: ${POSTGRES_USER:-findpro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findpro_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findpro_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findpro_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-findpro_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-findpro}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      API_V1_STR: /api/v1
      PROJECT_NAME: FindPro API
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - findpro_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: findpro_frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - findpro_network
    restart: unless-stopped

  # Nginx Reverse Proxy (опционально)
  nginx:
    image: nginx:alpine
    container_name: findpro_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - findpro_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  findpro_network:
    driver: bridge
